  v_max_mps: {value: 20.0, conf: A, src: "f1tenth_gym 缺省参数 v_max"}
  v_min_mps: {value: -5.0, conf: A, src: "f1tenth_gym 缺省参数 v_min"}
  a_max_mps2: {value: 9.51, conf: A, src: "f1tenth_gym 缺省参数 a_max"}
  a_brake_mps2: {value: 9.51, conf: D, src: "模拟参考值：取 a_max（f1tenth_gym 对加减速用同一上限）"}
  v_switch_mps: {value: 7.319, conf: A, src: "f1tenth_gym 缺省参数 v_switch"}
  k_speed_hz: {value: 3.0, conf: D, src: "模拟参考值：速度环增益"}
resistance:
