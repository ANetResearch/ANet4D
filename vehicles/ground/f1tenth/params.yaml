# vehicles/ground/f1tenth/params.yaml —— profile f1tenth 1.0.0（awr.vehicle.ground.v1）
# F1TENTH 级 1/10 阿克曼车。动力学参数逐项取 f1tenth_gym（gym/f110_gym/envs/f110_env.py）的缺省机体参数，即 CommonRoad 单轨模型
# （ST）的参数口径：c_sf / c_sr 为单位法向载荷下的侧偏刚度系数（1/rad），mu 为路面摩擦系数，h 为质心高（载荷转移）。
# 这辆车同时是地面域模型的对拍基准：awr.phys.l2.st_oracle 用同一组参数跑 CommonRoad ST 方程，与引擎逐用例比较。
schema: awr.vehicle.ground.v1
profile_version: 1.0.0
id: f1tenth
display_name: "F1TENTH-class 1/10 car"
display_name_zh: "1/10 自动驾驶车（F1TENTH 级）"
kind: ugv
status: identified
reference: "F1TENTH（f1tenth_gym 缺省参数）"
drive: {type: ackermann, wheels: 4, driven: rear, body: flu}
mass_kg: {value: 3.74, conf: A, src: "f1tenth_gym f110_env.py 缺省参数 m"}
